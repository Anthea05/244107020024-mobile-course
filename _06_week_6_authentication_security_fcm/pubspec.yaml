name: campus_notify
description: "Praktikum Week 6 Authentication, Security, dan FCM"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # HTTP Client & Keamanan
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4

  # Firebase & Notifikasi
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true